workflow:
  rules:
    # Allow running a pipeline on version branches (not tags!)
    - if: $CI_COMMIT_REF_NAME =~ "/^v/"

variables:
  DEBIAN_FRONTEND: "noninteractive"
  DEVELOPER: "1"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.90"
  # Ensure full repository clone with all branches (not shallow clone)
  GIT_DEPTH: 0
  UV_PYTHON: "3.10"
  PROTOC_VERSION: 3.19.3
  BRANCH: "lsps2-plugin"
stages:
  - build
  - remix
  - postprocess
  
build:tagged:
  stage: build
  image: ubuntu:20.04
  before_script: |
    
    apt-get update -qq
    apt-get install -qqy \
        autoconf \
        build-essential \
        clang \
        git \
        libgmp-dev \
        libpq-dev \
        libsqlite3-dev \
        libtool \
        python3 \
        python3-pip \
        openssh-client \
        systemtap-sdt-dev \
        curl \
        clang \
        tree \
        jq \
        unzip \
        libssl-dev \
        wget \
        libssl-dev \
        pkg-config \
        gettext \
        zlib1g-dev
    # UV downloads a python version on-demand
    curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${RUST_VERSION}
    ~/.cargo/bin/rustup toolchain install ${RUST_VERSION} --component rustfmt --allow-downgrade

    (
      cd /tmp
      wget https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip --quiet -O protoc.zip
      unzip protoc.zip
      mv bin/protoc /usr/local/bin/
    )
    
    git config --global user.email "ci@blockstream.com"
    git config --global user.name "Gitlab CI"

  script: |
    export PATH=$PATH:/usr/local/bin:$HOME/.cargo/bin
    cp build.py /tmp/build.py  # Copy so the git checkout doesn't remove us.
    /tmp/build.py build "$CI_COMMIT_REF_NAME"

  artifacts:
    paths:
      - lightningd-$CI_COMMIT_REF_NAME.tar.bz2
    expire_in: never
    
build:master:
  stage: build
  image: ubuntu:20.04
  before_script: |
    apt-get update -qq
    apt-get install -qqy \
        autoconf \
        build-essential \
        clang \
        git \
        libgmp-dev \
        libpq-dev \
        libsqlite3-dev \
        libtool \
        python3 \
        python3-pip \
        openssh-client \
        systemtap-sdt-dev \
        curl \
        clang \
        tree \
        jq \
        unzip \
        libssl-dev \
        wget \
        libssl-dev \
        pkg-config \
        gettext \
        zlib1g-dev
    curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.90
    ~/.cargo/bin/rustup toolchain install 1.90 --component rustfmt --allow-downgrade
    
    (
      cd /tmp
      wget https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip --quiet -O protoc.zip
      unzip protoc.zip
      mv bin/protoc /usr/local/bin/
    )
    
    git config --global user.email "ci@blockstream.com"
    git config --global user.name "Gitlab CI"

  script: |
    export PATH=$PATH:/usr/local/bin:$HOME/.cargo/bin
    cp build.py /tmp/build.py  # Copy so the git checkout doesn't remove us.
    git checkout ${BRANCH}
    /tmp/build.py build ${BRANCH}
  artifacts:
    paths:
      - lightningd-${BRANCH}.tar.bz2
    expire_in: never
remix:
  stage: remix
  image: ubuntu:20.04
  dependencies:
    - build:tagged
    - build:master
  before_script: |
    cat "$CI_SERVICE_ACCOUNT" > ci-service-account.json

    apt-get update -qq
    apt-get install -qqy \
        curl git tar build-essential

    curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${RUST_VERSION}

  script:
    - mkdir -p /tmp/tagged /tmp/master
    - tar -C /tmp/tagged/ -xjf lightningd-${CI_COMMIT_REF_NAME}.tar.bz2
    - tar -C /tmp/master/ -xjf lightningd-${BRANCH}.tar.bz2

    # Copy binaries over selectively from `master` into the tagged version
    - ls -lha /tmp/master/usr/local/libexec/c-lightning/plugins/
    - ls -lha /tmp/tagged/usr/local/libexec/c-lightning/plugins/
    - cp /tmp/master/usr/local/libexec/c-lightning/plugins/cln-renepay /tmp/tagged/usr/local/libexec/c-lightning/plugins/
    - cp /tmp/master/usr/local/libexec/c-lightning/plugins/cln-lsps-client /tmp/tagged/usr/local/libexec/c-lightning/plugins/

    # Reconstitute the tarball we are going to upload
    - tar -C /tmp/tagged/ -cjf lightningd-${CI_COMMIT_REF_NAME}.tar.bz2 usr manifest.json
    - PATH=$PATH:/usr/local/bin:$HOME/.cargo/bin ./build.py upload lightningd-${CI_COMMIT_REF_NAME}.tar.bz2 
      
manifest:
  # Generate the manifest for CLN versions. This file is a summary
  # telling the downloading parties what versions exist, what their
  # checksums are, and attest to their integrity via GPG signatures.
  stage: postprocess
  image: ubuntu:24.04
  dependencies:
    - remix
  before_script: |
    cat "$CI_SERVICE_ACCOUNT" > ci-service-account.json

    apt-get update -qq
    apt-get install -qqy \
                     curl git tar build-essential gpg
    curl -LsSf https://astral.sh/uv/install.sh | UV_INSTALL_DIR=/usr/local/bin sh
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain ${RUST_VERSION}

    # Initialize GPG directory with proper permissions
    mkdir -p ~/.gnupg
    chmod 700 ~/.gnupg

    # Decode and import the GPG private key from the secret variable
    cat "$GPG_PRIVATE_KEY"
    cat "$GPG_PRIVATE_KEY" | gpg --import

  script:
    - PATH=$PATH:/usr/local/bin:$HOME/.cargo/bin ./build.py genmanifest
